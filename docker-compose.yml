version: "3.9"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://corepulse:${POSTGRES_PASSWORD:-corepulse}@db:5432/corepulse
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-change-this-in-production-generate-with-openssl-rand-hex-32}
  ENV: production
  LOG_FORMAT: json
  LOG_LEVEL: INFO

services:
  # ── Database ─────────────────────────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: corepulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: corepulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corepulse}
      POSTGRES_DB: corepulse
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployments/scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corepulse -d corepulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [corepulse]

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: corepulse-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [corepulse]

  # ── API server ────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: corepulse-api
    restart: unless-stopped
    environment:
      <<: *backend-env
      WORKERS: 4
      PORT: 8000
    volumes:
      - ./backend:/app:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [corepulse]
    labels:
      - "traefik.enable=false"

  # ── Celery workers ────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: corepulse-worker
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 1G
    networks: [corepulse]

  # ── Celery beat ───────────────────────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: beat
    container_name: corepulse-beat
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [corepulse]

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: corepulse-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
      NODE_ENV: production
    depends_on:
      - api
    networks: [corepulse]

  # ── NGINX reverse proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: corepulse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deployments/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api
      - frontend
    networks: [corepulse]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3

  # ── Migration job (runs once on startup) ──────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: corepulse-migrate
    restart: "no"
    environment:
      <<: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks: [corepulse]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  corepulse:
    driver: bridge
    name: corepulse
